name: Probe Datafordeler access (temporary)

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe
        env:
          DATAFORDELER_USER: ${{ secrets.DATAFORDELER_USER }}
          DATAFORDELER_PASS: ${{ secrets.DATAFORDELER_PASS }}
          DATAFORDELER_API:  ${{ secrets.DATAFORDELER_API }}
        run: python3 scripts/probe_datafordeler.py
