name: Update housing data

on:
  schedule:
    - cron: "17 4 * * *"   # daily 04:17 UTC (~06:17 CET)
  workflow_dispatch: {}      # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"

      - name: Install parser deps
        run: pip install --quiet openpyxl

      - name: Pull listings from boligsiden.dk
        run: python3 scripts/build_data.py
        env:
          # kommune boundaries: DAGI/v2 primary, DAWA per-kommune fallback if
          # unset or the call fails (#27) — never a hard dependency
          DATAFORDELER_API: ${{ secrets.DATAFORDELER_API }}

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/listings.json data/meta.json data/geo.json data/history.json data/tracker.json data/priceindex.json data/bvc.json
          git add data/sold.json 2>/dev/null || true   # optional — only present when the sold fetch succeeds
          git add data/mortgage.json 2>/dev/null || true   # optional — realkreditrenter
          git add data/poi.json 2>/dev/null || true   # optional — amenities overlay (issue #7)
          if git diff --cached --quiet; then
            echo "No changes in listings — nothing to commit."
            exit 0
          fi
          git commit -m "Update housing data ($(date -u +%Y-%m-%d))"
          # the build takes ~11 minutes and main moves while it runs, so a plain
          # push loses the race and throws the whole scrape away
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push && exit 0
            echo "push attempt $i failed, retrying"
            sleep $((2 ** i))
          done
          exit 1
