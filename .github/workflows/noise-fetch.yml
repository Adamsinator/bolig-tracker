name: Fetch noise 2022 (one-off)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Direct archive URL (skips scraping the download page)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GDAL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch + clip
        env:
          NOISE_URL: ${{ inputs.url }}
        run: python3 scripts/fetch_noise_once.py
      - name: Commit the clipped layer
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/noise.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Add road-traffic noise 2022 (Lden), clipped to the corridor"
            git push
          fi
