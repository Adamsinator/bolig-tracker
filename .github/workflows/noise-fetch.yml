name: Fetch noise 2022 (one-off)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Direct archive URL (skips scraping the download page)"
        required: false
        default: ""
      probe:
        description: "Only report the chosen URL and its size, then stop"
        required: false
        default: ""
      layer:
        description: "Comma-separated filename substrings pinning which layers to use"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    # the archive is ~1.1 GB from a slow host and the clip is national-scale, so
    # this is a long job — but it should never sit there for GitHub's 6-hour default
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install GDAL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin python3-gdal
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 45 minutes of the run is the download alone. Keeping the archive lets a
      # retry — a different layer, a different resolution — cost about a minute.
      - name: Cache the source archive
        uses: actions/cache@v4
        with:
          path: /tmp/noise-cache
          key: noise-2022-tab
      - name: Fetch + build the grid
        env:
          NOISE_URL: ${{ inputs.url }}
          NOISE_PROBE: ${{ inputs.probe }}
          NOISE_LAYER: ${{ inputs.layer }}
        # the system python has the GDAL bindings; setup-python's does not
        run: /usr/bin/python3 scripts/fetch_noise_once.py
      - name: Commit the grid
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/noise.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Add road-traffic noise 2022 (Lden) as a 20 m dB grid"
          # main moves while this job runs — rebase onto it rather than failing
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push && exit 0
            echo "push attempt $i failed, retrying"
            sleep $((2 ** i))
          done
          exit 1
