name: Fetch BBR building attributes for Region Hovedstaden (one-off)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    # BBR_Bygning + EBR_Ejendomsbeliggenhed across 28 kommuner (~150 min,
    # proven), plus DAR resolution for the condo share (~30-40 min at the
    # confirmed real batch limit of 100) — generous runway kept regardless,
    # since each stage now checkpoints and a slow network day shouldn't
    # cost the whole run.
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Stage 1 — BBR_Bygning
        run: python3 scripts/fetch_bbr_once.py buildings
        env:
          DATAFORDELER_API: ${{ secrets.DATAFORDELER_API }}
      - name: Commit stage 1 cache
        run: |
          git add data/bbr_cache_buildings.json
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "BBR fetch: buildings cache (#26)"
            for i in 1 2 3 4; do
              git pull --rebase origin main && git push && break
              sleep $((2 ** i))
            done
          fi

      - name: Stage 2 — EBR_Ejendomsbeliggenhed
        run: python3 scripts/fetch_bbr_once.py ebr
        env:
          DATAFORDELER_API: ${{ secrets.DATAFORDELER_API }}
      - name: Commit stage 2 cache
        run: |
          git add data/bbr_cache_ebr.json
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "BBR fetch: EBR cache (#26)"
            for i in 1 2 3 4; do
              git pull --rebase origin main && git push && break
              sleep $((2 ** i))
            done
          fi

      - name: Stage 3 — DAR_Adresse batch resolution
        run: python3 scripts/fetch_bbr_once.py resolve
        env:
          DATAFORDELER_API: ${{ secrets.DATAFORDELER_API }}
      - name: Commit stage 3 cache
        run: |
          git add data/bbr_cache_dar.json
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "BBR fetch: DAR resolution cache (#26)"
            for i in 1 2 3 4; do
              git pull --rebase origin main && git push && break
              sleep $((2 ** i))
            done
          fi

      - name: Stage 4 — join and write data/bbr.json
        run: python3 scripts/fetch_bbr_once.py join
        env:
          DATAFORDELER_API: ${{ secrets.DATAFORDELER_API }}
      - name: Commit final data, remove caches
        run: |
          git add data/bbr.json
          git rm -f data/bbr_cache_buildings.json data/bbr_cache_ebr.json data/bbr_cache_dar.json
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Add BBR building attributes for Region Hovedstaden (#26)"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push && exit 0
            sleep $((2 ** i))
          done
          exit 1
