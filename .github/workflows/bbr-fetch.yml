name: Fetch BBR building attributes for Region Hovedstaden (one-off)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    # BBR_Bygning + EBR_Ejendomsbeliggenhed across 28 kommuner, plus DAR
    # resolution for the condo share — much larger than grundareal's single
    # DAWA endpoint, so this gets real runway rather than guessing short
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/fetch_bbr_once.py
        env:
          DATAFORDELER_API: ${{ secrets.DATAFORDELER_API }}
      - name: Commit the data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bbr.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Add BBR building attributes for Region Hovedstaden (#26)"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push && exit 0
            sleep $((2 ** i))
          done
          exit 1
