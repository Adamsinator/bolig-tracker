name: Probe DAR_Husnummer / DAR_Adresse schema (diagnostic)

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/probe_dar_schema.py
        env:
          DATAFORDELER_API: ${{ secrets.DATAFORDELER_API }}
      - run: python3 scripts/probe_dar_schema2.py
        env:
          DATAFORDELER_API: ${{ secrets.DATAFORDELER_API }}
