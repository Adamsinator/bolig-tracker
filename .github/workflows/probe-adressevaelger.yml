name: Probe Adressevaelger access requirements (diagnostic)

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/probe_adressevaelger.py
      - run: python3 scripts/probe_adressevaelger2.py
      - run: python3 scripts/probe_adressevaelger3.py
