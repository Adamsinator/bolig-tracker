name: Verify UTM32N->WGS84 conversion against DAWA (diagnostic, no commit)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/probe_utm_check.py
        env:
          DATAFORDELER_API: ${{ secrets.DATAFORDELER_API }}
