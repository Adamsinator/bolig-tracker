name: Probe DAR_Adresse batch resolution limit (diagnostic)

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/probe_dar_batch.py
        env:
          DATAFORDELER_API: ${{ secrets.DATAFORDELER_API }}
