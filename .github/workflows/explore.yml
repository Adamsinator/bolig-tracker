name: Explore OSM (temp)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe OSM
        run: python3 scripts/explore_osm.py
