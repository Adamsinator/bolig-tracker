name: Probe MAT_Jordstykke (temporary)

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          DATAFORDELER_API: ${{ secrets.DATAFORDELER_API }}
        run: python3 scripts/probe_mat.py
