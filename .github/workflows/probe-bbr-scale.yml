name: Probe BBR scale, real BFE filter, DAR husnummer link (diagnostic, no commit)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/probe_bbr_scale.py
        env:
          DATAFORDELER_API: ${{ secrets.DATAFORDELER_API }}
